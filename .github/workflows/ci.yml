name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` is exactly what Vercel runs. It refuses to install when
      # package-lock.json has drifted from package.json — which once broke every
      # deploy silently, because Vercel just keeps serving the last good build.
      # Failing here makes that loud instead.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
